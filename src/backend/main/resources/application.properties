quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:8180
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/cisys
quarkus.oidc.client-id=cisys-ui
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:cisys}
quarkus.datasource.password=${DB_PASSWORD:cisys}
# Tests get their own PostgreSQL from Quarkus Dev Services, so the URL is only set outside the test profile.
%dev,prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/cisys}
# The schema is owned by Flyway (src/backend/main/resources/db/migration); Hibernate only validates it.
# Databases created before migrations existed are baselined at version 0, so the repeatable R__schema.sql still runs.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
# Databases that applied the former V1__baseline.sql still record it; it is now part of R__schema.sql.
quarkus.flyway.ignore-migration-patterns=*:missing,*:future
quarkus.hibernate-orm.schema-management.strategy=validate

# Use the immutable Keycloak subject rather than preferred_username for ownership.
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.roles.source=accesstoken

# Sign everyone out when the application shuts down, using a service account with the manage-users role.
cisys.session.invalidate-on-shutdown=${SESSION_INVALIDATE_ON_SHUTDOWN:true}
cisys.keycloak.url=${KEYCLOAK_URL:http://localhost:8180}
cisys.keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:cisys-backend}
cisys.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:cisys}

# The runner is intended only for trusted code on a dedicated Linux host.
# It uses podman when it is installed, otherwise docker.

# How long the public front-page statistics are cached on the server, in seconds.
cisys.stats.cache-seconds=${STATS_CACHE_SECONDS:30}

# Safety limit for one build's stored output, in bytes; beyond it the build is marked truncated.
cisys.build.log-max-bytes=${BUILD_LOG_MAX_BYTES:1073741824}

# How often expired builds are deleted; admins set the limits under Settings > Retention.
cisys.retention.every=${BUILD_RETENTION_EVERY:1h}

# Repository access. Only these HTTPS hosts may be cloned, and every address they resolve to must
# be public unless the network is listed below. Add a local Git server to the hosts when needed.
cisys.git.allowed-hosts=${CISYS_GIT_ALLOWED_HOSTS:github.com,gitlab.com}
# Comma-separated IPv4 or IPv6 CIDR ranges that may be fetched even though they are private.
cisys.git.allowed-networks=${CISYS_GIT_ALLOWED_NETWORKS:}

# Single backend runner. Limits must be positive; queue-limit counts waiting builds only.
cisys.build.concurrency=${BUILD_CONCURRENCY:1}
cisys.build.queue-limit=${BUILD_QUEUE_LIMIT:100}
